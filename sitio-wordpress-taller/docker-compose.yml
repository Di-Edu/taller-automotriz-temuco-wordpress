# Entorno local de desarrollo: http://localhost:8080
# Uso:  docker compose up -d   (luego abrir http://localhost:8080 e instalar WordPress)
services:
  db:
    image: mariadb:11.4
    restart: unless-stopped
    environment:
      MARIADB_DATABASE: wordpress
      MARIADB_USER: wordpress
      MARIADB_PASSWORD: wordpress_local_dev
      MARIADB_RANDOM_ROOT_PASSWORD: "1"
    volumes:
      - db_data:/var/lib/mysql

  wordpress:
    image: wordpress:6.6-php8.2-apache
    restart: unless-stopped
    depends_on:
      - db
    ports:
      - "8080:80"
    environment:
      WORDPRESS_DB_HOST: db
      WORDPRESS_DB_NAME: wordpress
      WORDPRESS_DB_USER: wordpress
      WORDPRESS_DB_PASSWORD: wordpress_local_dev
      WORDPRESS_CONFIG_EXTRA: |
        define('WP_ENVIRONMENT_TYPE', 'local');
        define('WPLANG', 'es_CL');
    volumes:
      - wp_data:/var/www/html
      - ./wp-content/themes/taller-temuco:/var/www/html/wp-content/themes/taller-temuco
      - ./wp-content/plugins/taller-agenda:/var/www/html/wp-content/plugins/taller-agenda

volumes:
  db_data:
  wp_data:
