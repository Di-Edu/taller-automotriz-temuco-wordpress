<!doctype html>
<html lang="es">
<head>
<base target="_top">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Registro de Patentes</title>
<style>
:root{
  --bg:#f4f5f7; --card:#fff; --ink:#1c1f24; --muted:#6b7280; --line:#e3e5e8;
  --brand:#1f4fd1; --brand-ink:#fff; --ok:#16803c; --wa:#1fa855; --danger:#c62828;
  --plate:#fffbe6; --plate-line:#222;
}
@media (prefers-color-scheme: dark){
  :root{ --bg:#14161a; --card:#1d2026; --ink:#e8eaed; --muted:#9aa0a6; --line:#2e323a;
    --brand:#5b8cff; --brand-ink:#0b0d10; --plate:#2a2716; --plate-line:#d8d2a8; }
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
header{background:var(--card);border-bottom:1px solid var(--line);position:sticky;top:0;z-index:5}
.wrap{max-width:860px;margin:0 auto;padding:0 16px}
.top{display:flex;justify-content:space-between;align-items:center;gap:8px}
h1{font-size:1.15rem;margin:0;padding:14px 0 8px}
.icon{border:0;background:none;color:var(--muted);font:inherit;font-size:.85rem;cursor:pointer;padding:6px}
nav{display:flex;gap:4px;overflow-x:auto}
nav button{flex:0 0 auto;border:0;background:none;color:var(--muted);font:inherit;font-weight:600;padding:10px 14px;border-bottom:3px solid transparent;cursor:pointer}
nav button.on{color:var(--brand);border-color:var(--brand)}
main{padding:20px 0 60px}
section{display:none}section.on{display:block}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:16px;margin-bottom:14px}
label{display:block;font-size:.85rem;font-weight:600;color:var(--muted);margin:10px 0 4px}
input,textarea{width:100%;font:inherit;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:10px 12px}
input:focus,textarea:focus{outline:2px solid var(--brand);outline-offset:-1px}
.big{font-size:1.6rem;font-weight:700;letter-spacing:.12em;text-transform:uppercase;padding:14px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:0 14px}
@media (max-width:560px){.grid{grid-template-columns:1fr}}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border:0;border-radius:8px;padding:10px 16px;font:inherit;font-weight:600;cursor:pointer;text-decoration:none;background:var(--line);color:var(--ink)}
.btn:disabled{opacity:.6;cursor:wait}
.btn.pri{background:var(--brand);color:var(--brand-ink)}
.btn.wa{background:var(--wa);color:#fff}
.btn.call{background:var(--ok);color:#fff}
.btn.del{background:none;color:var(--danger);border:1px solid var(--danger)}
.row{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
.plate{display:inline-block;background:var(--plate);border:2px solid var(--plate-line);border-radius:6px;padding:2px 10px;font-weight:800;letter-spacing:.12em;font-size:1.25rem;font-family:ui-monospace,Consolas,monospace}
.res-head{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
dl{display:grid;grid-template-columns:auto 1fr;gap:4px 14px;margin:12px 0 0}
dt{color:var(--muted);font-size:.9rem}dd{margin:0;overflow-wrap:anywhere}
.muted{color:var(--muted)}.small{font-size:.85rem}
.empty{text-align:center;color:var(--muted);padding:24px}
table{width:100%;border-collapse:collapse;font-size:.92rem}
th,td{text-align:left;padding:8px 6px;border-bottom:1px solid var(--line);vertical-align:top}
th{color:var(--muted);font-weight:600}
tr.click{cursor:pointer}tr.click:hover{background:var(--bg)}
.tablewrap{overflow-x:auto}
.toast{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 18px;border-radius:8px;opacity:0;transition:opacity .2s;pointer-events:none;z-index:20;max-width:90vw}
.toast.on{opacity:1}
.warn{background:#fff4e5;color:#7a4b00;border-color:#f3c88b}
@media (prefers-color-scheme: dark){.warn{background:#2d2312;color:#f3c88b;border-color:#5c4520}}
#login{max-width:360px;margin:12vh auto 0}
.err{color:var(--danger);font-size:.9rem;min-height:1.2em;margin-top:8px}
</style>
</head>
<body>

<!-- PIN -->
<div id="loginView" class="wrap">
  <form id="login" class="card">
    <h1 style="padding:0 0 4px">🅿️ Registro de Patentes</h1>
    <label for="pin">PIN de acceso</label>
    <input id="pin" type="password" inputmode="numeric" autocomplete="current-password" class="big" required>
    <div class="err" id="loginErr"></div>
    <button class="btn pri" style="width:100%;margin-top:6px" id="btnLogin">Entrar</button>
  </form>
</div>

<!-- APP -->
<div id="appView" style="display:none">
<header><div class="wrap">
  <div class="top">
    <h1>🅿️ Registro de Patentes</h1>
    <div><button class="icon" id="btnRefresh" title="Actualizar">↻ Actualizar</button><button class="icon" id="btnLogout">Salir</button></div>
  </div>
  <nav>
    <button data-tab="buscar" class="on">Buscar</button>
    <button data-tab="inscribir">Inscribir</button>
    <button data-tab="registros">Registros (<span id="count">0</span>)</button>
  </nav>
</div></header>

<main class="wrap">
  <section id="buscar" class="on">
    <div class="card">
      <label for="q">Patente, nombre o unidad</label>
      <input id="q" class="big" placeholder="ABCD12" autocomplete="off">
    </div>
    <div id="results"></div>
  </section>

  <section id="inscribir">
    <form id="form" class="card" autocomplete="off">
      <h2 id="formTitle" style="margin:0 0 4px;font-size:1.1rem">Nueva inscripción</h2>
      <label for="f_patente">Patente *</label>
      <input id="f_patente" class="big" required placeholder="ABCD12">
      <div id="dupWarn" class="card warn small" style="display:none;margin:8px 0 0"></div>
      <div class="grid">
        <div><label for="f_nombre">Nombre *</label><input id="f_nombre" required></div>
        <div><label for="f_telefono">Celular (9 dígitos) *</label><input id="f_telefono" type="tel" inputmode="numeric" required placeholder="912345678"></div>
        <div><label for="f_unidad">Unidad / Oficina *</label><input id="f_unidad" required></div>
        <div><label for="f_anexo">Anexo institucional</label><input id="f_anexo" inputmode="numeric"></div>
        <div><label for="f_marca">Marca *</label><input id="f_marca" required></div>
        <div><label for="f_modelo">Modelo</label><input id="f_modelo"></div>
        <div><label for="f_color">Color *</label><input id="f_color" required></div>
      </div>
      <label for="f_obs">Observaciones</label>
      <textarea id="f_obs" rows="2"></textarea>
      <div class="row">
        <button class="btn pri" type="submit" id="btnSave">Guardar</button>
        <button class="btn" type="button" id="btnClear">Limpiar</button>
        <button class="btn del" type="button" id="btnDelete" style="display:none;margin-left:auto">Eliminar</button>
      </div>
    </form>
  </section>

  <section id="registros">
    <div class="card">
      <input id="filter" placeholder="Filtrar…">
      <div class="tablewrap" style="margin-top:12px">
        <table><thead><tr><th>Patente</th><th>Nombre</th><th>Unidad</th><th>Celular</th><th>Vehículo</th></tr></thead>
        <tbody id="tbody"></tbody></table>
      </div>
    </div>
  </section>
</main>
</div>
<div class="toast" id="toast"></div>

<script>
const $ = s => document.querySelector(s);
const PIN_KEY = 'patentes_pin';
let PIN = '', db = [], loadedAt = 0, editing = null;

function api(fn){
  const args = Array.prototype.slice.call(arguments, 1);
  return new Promise((res, rej) => google.script.run.withSuccessHandler(res).withFailureHandler(rej)[fn].apply(null, args));
}
const errMsg = e => (e && e.message ? e.message : String(e)).replace(/^Error:\s*/,'');
const norm = s => (s||'').toString().toUpperCase().replace(/[^A-Z0-9]/g,'');
const esc = s => (s||'').toString().replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function toast(m){ const t=$('#toast'); t.textContent=m; t.classList.add('on'); clearTimeout(toast.h); toast.h=setTimeout(()=>t.classList.remove('on'),2600); }
function getStored(){ try{ return localStorage.getItem(PIN_KEY)||'' }catch(e){ return '' } }
function setStored(v){ try{ v ? localStorage.setItem(PIN_KEY,v) : localStorage.removeItem(PIN_KEY) }catch(e){} }

function phoneDigits(p){
  let d = (p||'').replace(/\D/g,'');
  if (!d) return '';
  if (d.startsWith('00')) d = d.slice(2);
  if (d.length === 9 && d.startsWith('9')) d = '56'+d;
  if (d.length === 8) d = '569'+d;
  return d;
}
const vehiculo = r => [r.marca, r.modelo].filter(Boolean).join(' ');

// ---------- Login ----------
async function entrar(pin, silencioso){
  $('#btnLogin').disabled = true; $('#loginErr').textContent = silencioso ? 'Cargando…' : 'Verificando…';
  try{
    db = await api('listar', pin);
    PIN = pin; setStored(pin); loadedAt = Date.now();
    $('#loginView').style.display='none'; $('#appView').style.display='';
    $('#count').textContent = db.length; renderResults(); $('#q').focus();
  }catch(e){
    setStored(''); $('#loginErr').textContent = errMsg(e);
  }finally{ $('#btnLogin').disabled = false; }
}
$('#login').addEventListener('submit', e => { e.preventDefault(); entrar($('#pin').value.trim()); });
$('#btnLogout').onclick = () => { setStored(''); PIN=''; db=[]; $('#pin').value=''; $('#loginErr').textContent=''; $('#appView').style.display='none'; $('#loginView').style.display=''; };

async function refrescar(aviso){
  try{ db = await api('listar', PIN); loadedAt = Date.now(); $('#count').textContent=db.length; renderResults(); renderTable(); if(aviso) toast('Lista actualizada'); }
  catch(e){ toast(errMsg(e)); }
}
$('#btnRefresh').onclick = () => refrescar(true);
document.addEventListener('visibilitychange', () => { if(!document.hidden && PIN && Date.now()-loadedAt > 60000) refrescar(false); });

// ---------- Tabs ----------
document.querySelectorAll('nav button').forEach(b => b.onclick = () => showTab(b.dataset.tab));
function showTab(id){
  document.querySelectorAll('nav button').forEach(b => b.classList.toggle('on', b.dataset.tab===id));
  document.querySelectorAll('main section').forEach(s => s.classList.toggle('on', s.id===id));
  if(id==='registros') renderTable();
  if(id==='buscar'){ $('#q').focus(); if(Date.now()-loadedAt > 60000) refrescar(false); }
}

// ---------- Buscar ----------
function matches(r, q){
  const nq = norm(q); if(!nq) return false;
  return norm(r.patente).includes(nq) || norm(r.nombre).includes(nq) || norm(r.unidad).includes(nq);
}
function resultCard(r, i){
  const tel = phoneDigits(r.telefono);
  return `<div class="card">
    <div class="res-head"><span class="plate">${esc(r.patente)}</span><span class="muted small">${r.fecha?'Inscrito '+esc(String(r.fecha).split(' ')[0]):''}</span></div>
    <dl>
      <dt>Nombre</dt><dd><b>${esc(r.nombre)}</b></dd>
      ${r.unidad?`<dt>Unidad</dt><dd>${esc(r.unidad)}</dd>`:''}
      <dt>Celular</dt><dd>${esc(r.telefono)}</dd>
      ${r.anexo?`<dt>Anexo</dt><dd>${esc(r.anexo)}</dd>`:''}
      ${vehiculo(r)?`<dt>Vehículo</dt><dd>${esc(vehiculo(r))}</dd>`:''}
      ${r.color?`<dt>Color</dt><dd>${esc(r.color)}</dd>`:''}
      ${r.obs?`<dt>Obs.</dt><dd>${esc(r.obs)}</dd>`:''}
    </dl>
    <div class="row">
      ${tel?`<a class="btn wa" href="https://wa.me/${tel}" target="_blank" rel="noopener">WhatsApp</a>
      <a class="btn call" href="tel:+${tel}" target="_top">Llamar</a>`:''}
      <button class="btn" onclick="editRecord(${r.fila})">Editar</button>
    </div>
  </div>`;
}
function renderResults(){
  const q = $('#q').value, box = $('#results');
  if (!norm(q)) { box.innerHTML = `<p class="empty">Escribe una patente para buscar.<br><span class="small">${db.length} vehículos registrados</span></p>`; return; }
  const exact = db.filter(r => norm(r.patente)===norm(q));
  const rest = db.filter(r => norm(r.patente)!==norm(q) && matches(r,q));
  const list = exact.concat(rest).slice(0,30);
  box.innerHTML = list.length ? list.map(resultCard).join('')
    : `<div class="card empty">No se encontró <span class="plate">${esc(norm(q))}</span><div class="row" style="justify-content:center"><button class="btn pri" onclick="newWithPlate('${esc(norm(q))}')">Inscribir esta patente</button></div></div>`;
}
$('#q').addEventListener('input', renderResults);

// ---------- Inscribir ----------
const F = ['patente','nombre','telefono','unidad','anexo','marca','modelo','color','obs'];
function clearForm(){
  $('#form').reset(); editing = null;
  $('#formTitle').textContent='Nueva inscripción'; $('#btnDelete').style.display='none'; $('#dupWarn').style.display='none';
}
window.newWithPlate = p => { clearForm(); $('#f_patente').value=p; showTab('inscribir'); $('#f_nombre').focus(); };
window.editRecord = fila => {
  const r = db.find(x=>x.fila===fila); if(!r) return;
  clearForm(); editing = r; F.forEach(k=>$('#f_'+k).value=r[k]||'');
  $('#formTitle').textContent='Editar inscripción'; $('#btnDelete').style.display='';
  showTab('inscribir');
};
$('#f_patente').addEventListener('input', () => {
  const p = norm($('#f_patente').value), w = $('#dupWarn');
  const d = db.find(r => norm(r.patente)===p && (!editing || r.fila!==editing.fila));
  if (p && d){ w.innerHTML = `Esta patente ya está inscrita a nombre de <b>${esc(d.nombre)}</b>. <a href="#" onclick="editRecord(${d.fila});return false">Editar ese registro</a>`; w.style.display=''; }
  else w.style.display='none';
});
$('#form').addEventListener('submit', async e => {
  e.preventDefault();
  const rec = {}; F.forEach(k => rec[k] = $('#f_'+k).value.trim());
  rec.patente = norm(rec.patente);
  const btn = $('#btnSave'); btn.disabled = true; btn.textContent = 'Guardando…';
  try{
    let r = await api('guardar', PIN, rec, editing ? editing.fila : 0, editing ? editing.patente : '', false);
    if (r.duplicada){
      if (!confirm('Esa patente ya está inscrita. ¿Guardar otro registro igual?')) return;
      r = await api('guardar', PIN, rec, 0, '', true);
    }
    toast(editing ? 'Registro actualizado' : 'Patente inscrita');
    clearForm(); await refrescar(false);
    $('#q').value = rec.patente; showTab('buscar'); renderResults();
  }catch(err){ toast('Error: '+errMsg(err)); }
  finally{ btn.disabled = false; btn.textContent = 'Guardar'; }
});
$('#btnClear').onclick = clearForm;
$('#btnDelete').onclick = async () => {
  const r = editing; if(!r) return;
  if (!confirm(`¿Eliminar la patente ${r.patente} (${r.nombre})? Se borrará también de la planilla.`)) return;
  try{ await api('eliminar', PIN, r.fila, r.patente); toast('Registro eliminado'); clearForm(); await refrescar(false); showTab('registros'); }
  catch(err){ toast('Error: '+errMsg(err)); }
};

// ---------- Registros ----------
function renderTable(){
  const f = $('#filter').value;
  const rows = (norm(f) ? db.filter(r=>matches(r,f) || norm(r.telefono).includes(norm(f))) : db.slice())
    .sort((a,b)=>norm(a.patente).localeCompare(norm(b.patente)));
  $('#tbody').innerHTML = rows.map(r=>`<tr class="click" onclick="editRecord(${r.fila})"><td><b>${esc(r.patente)}</b></td><td>${esc(r.nombre)}</td><td>${esc(r.unidad)}</td><td>${esc(r.telefono)}</td><td>${esc([vehiculo(r),r.color].filter(Boolean).join(' · '))}</td></tr>`).join('')
    || `<tr><td colspan="5" class="empty">Sin registros</td></tr>`;
}
$('#filter').addEventListener('input', renderTable);

// ---------- Inicio ----------
const saved = getStored();
if (saved) entrar(saved, true); else $('#pin').focus();
</script>
</body>
</html>
